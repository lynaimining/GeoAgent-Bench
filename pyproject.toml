[project]
name = "geoagent-bench"
version = "1.0.0"
description = "Reproducible geospatial and mineral-exploration agent tasks"
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
gis = [
    "geopandas>=1.1,<2",
    "rasterio>=1.4,<2",
    "numpy>=2.1,<3",
    "pyogrio>=0.10,<1",
    "pyproj>=3.7,<4",
    "shapely>=2.1,<3",
]
analysis = [
    {include-group = "gis"},
    "scipy>=1.15,<2",
    "scikit-learn>=1.6,<2",
    "openpyxl>=3.1,<4",
    "netCDF4>=1.7,<2",
    "matplotlib>=3.10,<4",
    "networkx>=3.4,<4",
    "pillow>=11,<14",
]
postgis = ["psycopg2-binary>=2.9.10,<3"]
download = ["gdown>=5.2,<7"]

[tool.uv]
package = false
default-groups = []
environments = ["sys_platform == 'win32' or sys_platform == 'linux' or sys_platform == 'darwin'"]
