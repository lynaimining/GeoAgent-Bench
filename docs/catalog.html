ent": "成果与输入/参数/真实执行回执一一对应；文件或表确实存在且读回验证；只给计划不得获得操作完成分。"}]}, {"id": "G200-01-C02", "title": "钻孔项目可追溯导入包", "goal": "把 合成 四表变成可复用导入包：盘点→字段映射→关系检查→生成分孔数据索引。没有凭据的单位写 unknown；不补造测斜或品位。", "domain": "01", "difficulty": "composite", "origin": "new", "progression": 3, "profiles": ["python"], "noncommercial": false, "replacement": true, "grading": "评分合同与证据复核", "stages": ["盘点四表", "建立规范字段映射", "检查跨表关系与深度", "打包索引和问题报告"], "prompt": "# G200-01-C02 · 钻孔项目可追溯导入包\n\n输入读取自 inputs/。所有新建本地文件写入 outputs/。\n只使用本题提供的数据和工具。先核对 CRS、字段、版本、单位和运行条件。\n提交实际成果与读回证据。需要澄清业务条件时说明具体问题，环境缺失时列出未完成的工作。\n\n把 合成 四表变成可复用导入包：盘点→字段映射→关系检查→生成分孔数据索引。没有凭据的单位写 unknown；不补造测斜或品位。\n\n## 有依赖的阶段\n\n1. 盘点四表\n2. 建立规范字段映射\n3. 检查跨表关系与深度\n4. 打包索引和问题报告\n\n## 输入文件\n\n- data/synthetic/mining/drill1/01_collar.csv\n- data/synthetic/mining/drill1/02_survey.csv\n- data/synthetic/mining/drill1/03_assay.csv\n- data/synthetic/mining/drill1/04_litho.csv\n\n## 代码与成果提交\n\n- Python 3.12 标准库可读取 JSON、CSV、OBJ 等文本输入。按题目实现校验、聚合或出具清单。\n- 在 outputs/result.json 填写 status、summary、metrics、artifacts、evidence 和 limitations。如需澄清，补充 reason_code。\n- 使用代码时保留本次执行的脚本或 SQL 及复跑命令。使用工具时记录工具版本、参数、回执和读回。中间结果应能通过输入文件名及参数追溯。\n", "sources": [{"name": "GeoAgent-Bench synthetic fixtures", "locator": "local teaching design", "url": "../geoagent_bench/fixtures.py", "revision": "public-1.0"}], "criteria": [{"id": "C1", "points": 25, "requirement": "四表哈希、schema 和记录数完整"}, {"id": "C2", "points": 40, "requirement": "孤儿键、重复键、深度问题定位到原行"}, {"id": "C3", "points": 25, "requirement": "导入索引只引用原数据或有清晰转换关系的文件"}, {"id": "E", "points": 10, "requirement": "成果与输入/参数/真实执行回执一一对应；文件或表确实存在且读回验证；只给计划不得获得操作完成分。"}]}, {"id": "G200-02-S01", "title": "混合 CRS 米制距离查询", "goal": "执行所附公开原题，建立 Main River 500 m 内在用学校表，输出 EPSG:32643。", "domain": "02", "difficulty": "single", "origin": "public_original", "progression": 2, "profiles": ["postgis"], "noncommercial": false, "replacement": false, "grading": "PostGIS 终态检查与证据复核", "stages": [], "prompt": "# G200-02-S01 · 混合 CRS 米制距离查询\n\n输入读取自 inputs/。所有新建本地文件写入 outputs/。\n只使用本题提供的数据和工具。先核对 CRS、字段、版本、单位和运行条件。\n提交实际成果与读回证据。需要澄清业务条件时说明具体问题，环境缺失时列出未完成的工作。\n\n执行所附公开原题，建立 Main River 500 m 内在用学校表，输出 EPSG:32643。\n\n## 上游题干\n\nCreate table flood_risk_schools containing active schools within 500 metres of the Main River. Include columns school_id, name, geom, in EPSG:32643.\n\n## 输入文件\n\n- data/public/GeoAgentEval/worlds/my_world_v0_crsmix/docs/data_dictionary.md\n\n## 代码与成果提交\n\n- 每次运行使用独立数据库。使用 BENCH_DB_DSN 或适配器提供的 SQL 工具。提交执行过的 SQL 和对象读回，保留列名、类型、SRID 与结果表名。\n- 在 outputs/result.json 填写 status、summary、metrics、artifacts、evidence 和 limitations。如需澄清，补充 reason_code。\n- 使用代码时保留本次执行的脚本或 SQL 及复跑命令。使用工具时记录工具版本、参数、回执和读回。中间结果应能通过输入文件名及参数追溯。\n- 在数据库 public schema 提交表 flood_risk_schools，至少含列 school_id, name, geom。\n- 输出几何类型 Point，EPSG:32643。\n- 同步提交执行结果、读回表名及证据。输出缺失条件时填写 reason_code，可用 ambiguous_request、contradictory_constraints、missing_layer 或本题实际原因。\n", "sources": [{"name": "GeoAgentEval", "locator": "tasks/crs_007.json", "url": "https://github.com/hsd2514/geoagenteval/tree/3da32ce6eb13dac8e0ac263e1e9830da67b8a56b", "revision": "3da32ce6eb13dac8e0ac263e1e9830da67b8a56b"}], "criteria": [{"id": "C1", "points": 25, "requirement": "真实 ST_Transform 而非只改 SRID"}, {"id": "C2", "points": 40, "requirement": "输出对象集合和几何满足 verifier"}, {"id": "C3", "points": 25, "requirement": "距离边界和输出字段遵循原题"}, {"id": "E", "points": 10, "requirement": "成果与输入/参数/真实执行回执一一对应；文件或表确实存在且读回验证；只给计划不得获得操作完成分。"}]}, {"id": "G200-02-S02", "title": "缺少距离单位的最小澄清", "goal": "执行所附原题：距 South Highway 为“2”以内的在用学校。", "domain": "02", "difficulty": "single", "origin": "public_original", "progression": 1, "profiles": ["postgis"], "noncommercial": false, "replacement": false, "grading": "PostGIS 终态检查与证据复核", "stages": [], "prompt": "# G200-02-S02 · 缺少距离单位的最小澄清\n\n输入读取自 inputs/。所有新建本地文件写入 outputs/。\n只使用本题提供的数据和工具。先核对 CRS、字段、版本、单位和运行条件。\n提交实际成果与读回证据。需要澄清业务条件时说明具体问题，环境缺失时列出未完成的工作。\n\n执行所附原题：距 South Highway 为“2”以内的在用学校。\n\n## 上游题干\n\nCreate table schools_near_highway containing active schools within 2 of the South Highway.\n\n## 输入文件\n\n- data/public/GeoAgentEval/worlds/my_world_v0/docs/data_dictionary.md\n\n## 代码与成果提交\n\n- 每次运行使用独立数据库。使用 BENCH_DB_DSN 或适配器提供的 SQL 工具。提交执行过的 SQL 和对象读回，保留列名、类型、SRID 与结果表名。\n- 在 outputs/result.json 填写 status、summary、metrics、artifacts、evidence 和 limitations。如需澄清，补充 reason_code。\n- 使用代码时保留本次执行的脚本或 SQL 及复跑命令。使用工具时记录工具版本、参数、回执和读回。中间结果应能通过输入文件名及参数追溯。\n- 同步提交执行结果、读回表名及证据。输出缺失条件时填写 reason_code，可用 ambiguous_request、contradictory_constraints、missing_layer 或本题实际原因。\n", "sources": [{"name": "GeoAgentEval", "locator": "tasks/amb_017.json", "url": "https://github.com/hsd2514/geoagenteval/tree/3da32ce6eb13dac8e0ac263e1e9830da67b8a56b", "revision": "3da32ce6eb13dac8e0ac263e1e9830da67b8a56b"}], "criteria": [{"id": "C1", "points": 25, "requirement": "指出 2 的单位缺失"}, {"id": "C2", "points": 40, "requirement": "提出一个直接影响结果的澄清，不擅自按公里"}, {"id": "C3", "points": 25, "requirement": "不生成声称正确的空间结果表"}, {"id": "E", "points": 10, "requirement": "成果与输入/参数/真实执行回执一一对应；文件或表确实存在且读回验证；只给计划不得获得操作完成分。"}]}, {"id": "G200-02-S03", "title": "损坏几何的定向修复", "goal": "执行所附原题，在授权测试输出表中修复损坏几何；保持要求的列和当前版本。", "domain": "02", "difficulty": "single", "origin": "public_original", "progression": 3, "profiles": ["postgis"], "noncommercial": false, "replacement": false, "grading": "PostGIS 终态检查与证据复核", "stages": [], "prompt": "# G200-02-S03 · 损坏几何的定向修复\n\n输入读取自 inputs/。所有新建本地文件写入 outputs/。\n只使用本题提供的数据和工具。先核对 CRS、字段、版本、单位和运行条件。\n提交实际成果与读回证据。需要澄清业务条件时说明具体问题，环境缺失时列出未完成的工作。\n\n执行所附原题，在授权测试输出表中修复损坏几何；保持要求的列和当前版本。\n\n## 上游题干\n\nschool_locations_broken is supposed to hold the current locations of every active school, but something is wrong with it. Fix it in place: school_locations_broken must end up with the correct present-day geometry for every row, with all other columns unchanged.\n\n## 输入文件\n\n- data/public/GeoAgentEval/worlds/my_world_v0/docs/data_dictionary.md\n\n## 代码与成果提交\n\n- 每次运行使用独立数据库。使用 BENCH_DB_DSN 或适配器提供的 SQL 工具。提交执行过的 SQL 和对象读回，保留列名、类型、SRID 与结果表名。\n- 在 outputs/result.json 填写 status、summary、metrics、artifacts、evidence 和 limitations。如需澄清，补充 reason_code。\n- 使用代码时保留本次执行的脚本或 SQL 及复跑命令。使用工具时记录工具版本、参数、回执和读回。中间结果应能通过输入文件名及参数追溯。\n- 在数据库 public schema 提交表 school_locations_broken，至少含列 school_id, name, status, enrollment, geom。\n- 同步提交执行结果、读回表名及证据。输出缺失条件时填写 reason_code，可用 ambiguous_request、contradictory_constraints、missing_layer 或本题实际原因。\n", "sources": [{"name": "GeoAgentEval", "locator": "tasks/repair_025.json", "url": "https://github.com/hsd2514/geoagenteval/tree/3da32ce6eb13dac8e0ac263e1e9830da67b8a56b", "revision": "3da32ce6eb13dac8e0ac263e1e9830da67b8a56b"}], "criteria": [{"id": "C1", "points": 25, "requirement": "定位实际几何问题和旧版陷阱"}, {"id": "C2", "points": 40, "requirement": "按当前源记录修复，不能删去问题行掩盖缺陷"}, {"id": "C3", "points": 25, "requirement": "输出符合上游 verifier 并有读回"}, {"id": "E", "points": 10, "requirement": "成果与输入/参数/真实执行回执一一对应；文件或表确实存在且读回验证；只给计划不得获得操作完成分。"}]}, {"id": "G200-02-S04", "title": "路网缺失 CRS 阻断识别", "goal": "请求用 network、school、Marketplace 算真实最短距离。先审查本题文件；缺少足够 CRS 证据时说明缺口、提供最小补充要求，不能从坐标大小猜 EPSG。", "domain": "02", "difficulty": "single", "origin": "adapted", "progression": 1, "profiles": ["gis"], "noncommercial": false, "replacement": false, "grading": "评分合同与证据复核", "stages": [], "prompt": "# G200-02-S04 · 路网缺失 CRS 阻断识别\n\n输入读取自 inputs/。所有新建本地文件写入 outputs/。\n只使用本题提供的数据和工具。先核对 CRS、字段、版本、单位和运行条件。\n提交实际成果与读回证据。需要澄清业务条件时说明具体问题，环境缺失时列出未完成的工作。\n\n请求用 network、school、Marketplace 算真实最短距离。先审查本题文件；缺少足够 CRS 证据时说明缺口、提供最小补充要求，不能从坐标大小猜 EPSG。\n\n## 输入文件\n\n- data/public/GABench/dataset/Marketplace.dbf\n- data/public/GABench/dataset/Marketplace.sbn\n- data/public/GABench/dataset/Marketplace.sbx\n- data/public/GABench/dataset/Marketplace.shp\n- data/public/GABench/dataset/Marketplace.shx\n- data/public/GABench/dataset/network.dbf\n- data/public/GABench/dataset/network.sbn\n- data/public/GABench/dataset/network.sbx\n- data/public/GABench/dataset/network.shp\n- data/public/GABench/dataset/network.shx\n- data/public/GABench/dataset/school.dbf\n- data/public/GABench/datas  "points": 25, "requirement": "引用地区记录的 source/year，不只给泛泛警告"}, {"id": "E", "points": 10, "requirement": "成果与输入/参数/真实执行回执一一对应；文件或表确实存在且读回验证；只给计划不得获得操作完成分。"}]}, {"id": "G200-02-C01", "title": "污染结果审计与验证", "goal": "完成所附原题审计：检查输入版本和地址连接基数，定位已有结果的两个缺陷，生成修正表并出具复核记录。", "domain": "02", "difficulty": "composite", "origin": "adapted", "progression": 3, "profiles": ["postgis"], "noncommercial": false, "replacement": false, "grading": "PostGIS 终态检查与证据复核", "stages": ["检查源表版本和关系", "诊断错误输出", "重建正确结果", "回查并出具审计说明"], "prompt": "# G200-02-C01 · 污染结果审计与验证\n\n输入读取自 inputs/。所有新建本地文件写入 outputs/。\n只使用本题提供的数据和工具。先核对 CRS、字段、版本、单位和运行条件。\n提交实际成果与读回证据。需要澄清业务条件时说明具体问题，环境缺失时列出未完成的工作。\n\n完成所附原题审计：检查输入版本和地址连接基数，定位已有结果的两个缺陷，生成修正表并出具复核记录。\n\n## 上游题干\n\nA previous analyst produced table school_directory_broken, intended to list active schools with their primary address and enrollment. It has TWO independent defects. Audit it: create table audit_result(defect_category text) with exactly two rows naming both defects, using values from: boundary_exclusion, crs_error, join_multiplicity, stale_data, wrong_filter, duplicate_rows. Then create table school_directory_fixed(school_id, name, enrollment, address) with the corrected rows.\n\n## 有依赖的阶段\n\n1. 检查源表版本和关系\n2. 诊断错误输出\n3. 重建正确结果\n4. 回查并出具审计说明\n\n## 输入文件\n\n- data/public/GeoAgentEval/worlds/my_world_v0/docs/data_dictionary.md\n\n## 代码与成果提交\n\n- 每次运行使用独立数据库。使用 BENCH_DB_DSN 或适配器提供的 SQL 工具。提交执行过的 SQL 和对象读回，保留列名、类型、SRID 与结果表名。\n- 在 outputs/result.json 填写 status、summary、metrics、artifacts、evidence 和 limitations。如需澄清，补充 reason_code。\n- 使用代码时保留本次执行的脚本或 SQL 及复跑命令。使用工具时记录工具版本、参数、回执和读回。中间结果应能通过输入文件名及参数追溯。\n- 在数据库 public schema 提交表 school_directory_fixed，至少含列 school_id, name, enrollment, address。\n- 同步提交执行结果、读回表名及证据。输出缺失条件时填写 reason_code，可用 ambiguous_request、contradictory_constraints、missing_layer 或本题实际原因。\n", "sources": [{"name": "GeoAgentEval", "locator": "tasks/audit_024.json", "url": "https://github.com/hsd2514/geoagenteval/tree/3da32ce6eb13dac8e0ac263e1e9830da67b8a56b", "revision": "3da32ce6eb13dac8e0ac263e1e9830da67b8a56b"}], "criteria": [{"id": "C1", "points": 25, "requirement": "必须同时发现归档版本和连接放大缺陷"}, {"id": "C2", "points": 40, "requirement": "修正结果符合上游 verifier"}, {"id": "C3", "points": 25, "requirement": "审计、修正、回查三类证据互相一致"}, {"id": "E", "points": 10, "requirement": "成果与输入/参数/真实执行回执一一对应；文件或表确实存在且读回验证；只给计划不得获得操作完成分。"}]}, {"id": "G200-02-C02", "title": "钻孔受控缺陷定位与隔离", "goal": "对受控故障四表执行 QA：定位坏行→评估关联影响→生成隔离清单→输出不改写源文件的修复建议。故障是测试注入，不代表原项目质量。", "domain": "02", "difficulty": "composite", "origin": "new", "progression": 3, "profiles": ["python"], "noncommercial": false, "replacement": true, "grading": "评分合同与证据复核", "stages": ["盘点与关系检查", "区间和测斜检查", "定位根因及影响孔", "生成隔离与修复建议"], "prompt": "# G200-02-C02 · 钻孔受控缺陷定位与隔离\n\n输入读取自 inputs/。所有新建本地文件写入 outputs/。\n只使用本题提供的数据和工具。先核对 CRS、字段、版本、单位和运行条件。\n提交实际成果与读回证据。需要澄清业务条件时说明具体问题，环境缺失时列出未完成的工作。\n\n对受控故障四表执行 QA：定位坏行→评估关联影响→生成隔离清单→输出不改写源文件的修复建议。故障是测试注入，不代表原项目质量。\n\n## 有依赖的阶段\n\n1. 盘点与关系检查\n2. 区间和测斜检查\n3. 定位根因及影响孔\n4. 生成隔离与修复建议\n\n## 输入文件\n\n- data/synthetic/mining/drill_fault/01_collar.csv\n- data/synthetic/mining/drill_fault/02_survey.csv\n- data/synthetic/mining/drill_fault/03_assay.csv\n- data/synthetic/mining/drill_fault/04_litho.csv\n- data/synthetic/mining/drill_fault/README.md\n\n## 代码与成果提交\n\n- Python 3.12 标准库可读取 JSON、CSV、OBJ 等文本输入。按题目实现校验、聚合或出具清单。\n- 在 outputs/result.json 填写 status、summary、metrics、artifacts、evidence 和 limitations。如需澄清，补充 reason_code。\n- 使用代码时保留本次执行的脚本或 SQL 及复跑命令。使用工具时记录工具版本、参数、回执和读回。中间结果应能通过输入文件名及参数追溯。\n", "sources": [{"name": "GeoAgent-Bench synthetic fixtures", "locator": "local teaching design", "url": "../geoagent_bench/fixtures.py", "revision": "public-1.0"}], "criteria": [{"id": "C1", "points": 25, "requirement": "每个注入缺陷定位原行/孔号及类型"}, {"id": "C2", "points": 40, "requirement": "既报真实问题也避免把正常测斜变化误报"}, {"id": "C3", "points": 25, "requirement": "隔离集合和下游影响可复算，原文件哈希不变"}, {"id": "E", "points": 10, "requirement": "成果与输入/参数/真实执行回执一一对应；文件或表确实存在且读回验证；只给计划不得获得操作完成分。"}]}, {"id": "G200-03-S01", "title": "逐行政区学校与人口统计", "goal": "建立 schools_per_ward：每个 ward 的 ID、名称、人口和点落在面内的学校数，包含所有状态学校，按 ward_id 升序。 具体约束以附带公开原题为准。", "domain": "03", "difficulty": "single", "origin": "public_original", "progression": 2, "profiles": ["postgis"], "noncommercial": false, "replacement": false, "grading": "PostGIS 终态检查与证据复核", "stages": [], "prompt": "# G200-03-S01 · 逐行政区学校与人口统计\n\n输入读取自 inputs/。所有新建本地文件写入 outputs/。\n只使用本题提供的数据和工具。先核对 CRS、字段、版本、单位和运行条件。\n提交实际成果与读回证据。需要澄清业务条件时说明具体问题，环境缺失时列出未完成的工作。\n\n建立 schools_per_ward：每个 ward 的 ID、名称、人口和点落在面内的学校数，包含所有状态学校，按 ward_id 升序。 具体约束以附带公开原题为准。\n\n## 上游题干\n\nCreate table schools_per_ward containing ward_id, ward_name, population, school_count for every ward. school_count is the number of schools (any status) whose point geometry falls inside the ward polygon. Order the result by ward_id ascending.\n\n## 输入文件\n\n- data/public/GeoAgentEval/worlds/my_world_v0/docs/data_dictionary.md\n\n## 代码与成果提交\n\n- 每次运行使用独立数据库。使用 BENCH_DB_DSN 或适配器提供的 SQL 工具。提交执行过的 SQL 和对象读回，保留列名、类型、SRID 与结果表名。\n- 在 outputs/result.json 填写 status、summary、metrics、artifacts、evidence 和 limitations。如需澄清，补充 reason_code。\n- 使用代码时保留本次执行的脚本或 SQL 及复跑命令。使用工具时记录工具版本、参数、回执和读回。中间结果应能通过输入文件名及参数追溯。\n- 在数据库 public schema 提交表 schools_per_ward，至少含列 ward_id, ward_name, population, school_count。\n- 同步提交执行结果、读回表名及证据。输出缺失条件时填写 reason_code，可用 ambiguous_request、contradictory_constraints、missing_layer 或本题实际原因。\n", "sources": [{"name": "GeoAgentEval", "locator": "tasks/ward_002.json", "url": "https://github.com/hsd2514/geoagenteval/tree/3da32ce6eb13dac8e0ac263e1e9830da67b8a56b", "revision": "3da32ce6eb13dac8e0ac263e1e9830da67b8a56b"}], "criteria": [{"id": "C1", "points": 25, "requirement": "表/字段/状态条件与原题完全一致"}, {"id": "C2", "points": 40, "requirement": "对象行集、聚合数值或澄清行为满足原 verifier"}, {"id": "C3", "points": 25, "requirement": "读回结果，禁止一对多连接重复计算或读取隐藏答案"}, {"id": "E", "points": 10, "requirement": "成果与输入/参数/真实执行回执一一对应；文件或表确实存在且读回验证；只给计划不得获得操作完成分。"}]}, {"id": "G200-03-S02", "title": "医院邻近地铁查询去重", "goal": "建立 hospitals_near_metro：距至少一个地铁站 1 km 内医院的 hospital_id 和 name；每医院一行。 具体约束以附带公开原题为准。", "domain": "03", "difficulty": "single", "origin": "public_original", "progression": 2, "profiles": ["postgis"], "noncommercial": false, "replacement": false, "grading": "PostGIS 终态检查与证据复核", "stages": [], "prompt": "# G200-03-S02 · 医院邻近地铁查询去重\n\n输入读取自 inputs/。所有新建本地文件写入 outputs/。\n只使用本题提供的数据和工具。先核对 CRS、字段、版本、单位和运行条件。\n提交实际成果与读回证据。需要澄清业务条件时说明具体问题，环境缺失时列出未完成的工作。\n\n建立 hospitals_near_metro：距至少一个地铁站 1 km 内医院的 hospital_id 和 name；每医院一行。 具体约束以附带公开原题为准。\n\n## 上游题干\n\nCreate table hospitals_near_metro containing hospital_id, name for every hospital within 1 kilometre of at least one metro station.\n\n## 输入文件\n\n- data/public/GeoAgentEval/worlds/my_world_v0/docs/data_dictionary.md\n\n## 代码与成果提交\n\n- 每次运行使用独立数据库。使用 BENCH_DB_DSN 或适配器提供的 SQL 工具。提交执行过的 SQL 和对象读回，保留列名、类型、SRID 与结果表名。\n- 在 outputs/result.json 填写 status、summary、metrics、artifacts、evidence 和 limitations。如需澄清，补充 reason_code。\n- 使用代码时保留本次执行的脚本或 SQL 及复跑命令。使用工具时记录工具版本、参数、回执和读回。中间结果应能通过输入文件名及参数追溯。\n- 在数据库 public schema 提交表 hospitals_near_metro，至少含列 hospital_id, name。\n- 同步提交执行结果、读回表名及证据。输出缺失条件时填写 reason_code，可用 ambiguous_request、contradictory_constraints、missing_layer 或本题实际原因。\n", "sources": [{"name": "GeoAgentEval", "locator": "tasks/near_003.json", "url": "https://github.com/hsd2514/geoagenteval/tree/3da32ce6eb13dac8e0ac263e1e9830da67b8a56b", "revision": "3da32ce6eb13dac8e0ac263e1e9830da67b8a56b"}], "criteria": [{"id": "C1", "points": 25, "requirement": "表/字段/状态条件与原题完全一致"}, {"id": "C2", "points": 40, "requirement": "对象行集、聚合数值或澄清行为满足原 verifier"}, {"id": "C3", "points": 25, "requirement": "读回结果，禁止一对多连接重复计算或读取隐藏答案"}, {"id": "E", "points": 10, "requirement": "成果与输入/参数/真实执行回执一一对应；文件或表确实存在且读回验证；只给计划不得获得操作完成分。"}]}, {"id": "G200-03-S03", "title": "历史人数与当前几何对照", "goal": "建立 enrollment_change：对两版本均存在的学校列出 2019/当前入学人数及 delta=now-2019，状态与几何使用当前版。 具体约束以附带公开原题为准。", "domain": "03", "difficulty": "single", "origin": "public_original", "progression": 2, "profiles": ["postgis"], "noncommercial": false, "replacement": false, "grading": "PostGIS 终态检查与证据复核", "stages": [], "prompt": "# G200-03-S03 · 历史人数与当前几何对照\n\n输入读取自 inputs/。所有新建本地文件写入 outputs/。\n只使用本题提供的数据和工具。先核对 CRS、字段、版本、单位和运行条件。\n提交实际成果与读回证据。需要澄清业务条件时说明具体问题，环境缺失时列出未完成的工作。\n\n建立 enrollment_change：对两版本均存在的学校列出 2019/当前入学人数及 delta=now-2019，状态与几何使用当前版。 具体约束以附带公开原题为准。\n\n## 上游题干\n\nCreate table enrollment_change containing school_id, name, status, enrollment_2019, enrollment_now, delta, geom for every school present in both schools_2019_archive and schools_current. status and geom must reflect the CURRENT (present-day) state, not the 2019 archive. delta = enrollment_now - enrollment_2019.\n\n## 输入文件\n\n- data/public/GeoAgentEval/worlds/my_world_v0/docs/data_dictionary.md\n\n## 代码与成果提交\n\n- 每次运行使用独立数据库。使用 BENCH_DB_DSN 或适配器提供的 SQL 工具。提交执行过的 SQL 和对象读回，保留列名、类型、SRID 与结果表名。\n- 在 outputs/result.json 填写 status、summary、metrics、artifacts、evidence 和 limitations。如需澄清，补充 reason_code。\n- 使用代码时保留本次执行的脚本或 SQL 及复跑命令。使用工具时记录工具版本、参数、回执和读回。中间结果应能通过输入文件名及参数追溯。\n- 在数据库 public schema 提交表 enrollment_change，至少含列 school_id, name, status, enrollment_2019, enrollment_now, delta, geom。\n- 同步提交执行结果、读回表名及证据。输出缺失条件时填写 reason_code，可用 ambiguous_request、contradictory_constraints、missing_layer 或本题实际原因。\n", "sources": [{"name": "GeoAgentEval", "locator": "tasks/stale_021.json", "url": "https://github.com/hsd2514/geoagenteval/tree/3da32ce6eb13dac8e0ac263e1e9830da67b8a56b", "revision": "3da32ce6eb13dac8e0ac263e1e9830da67b8a56b"}], "criteria": [{"id": "C1", "points": 25, "requirement": "表/字段/状态条件与原题完全一致"}, {"id": "C2", "points": 40, "requirement": "对象行集、聚合数值或澄清行为满足原 verifier"}, {"id": "C3", "points": 25, "requirement": "读回结果，禁止一对多连接重复计算或读取隐藏答案"}, {"id": "E", "points": 10, "requirement": "成果与输入/参数/真实执行回执一一对应；文件或表确实存在且读回验证；只给计划不得获得操作完成分。"}]}, {"id": "G200-03-S04", "title": "最近医院分配及零值组", "goal": "建立 hospital_catchments：每所在用学校分配到最近医院，逐院汇总学校数和学生数，零学校医院也出现。 具体约束以附带公开原题为准。", "domain": "03", "difficulty": "single", "origin": "public_original", "progression": 3, "profiles": ["postgis"], "noncommercial": false, "replacement": false, "grading": "PostGIS 终态检查与证据复核", "stages": [], "prompt": "# G200-03-S04 · 最近医院分配及零值组\n\n输入读取自 inputs/。所有新建本地文件写入 outputs/。\n只使用本题提供的数据和工具。先核对 CRS、字段、版本、单位和运行条件。\n提交实际成果与读回证据。需要澄清业务条件时说明具体问题，环境缺失时列出未完成的工作。\n\n建立 hospital_catchments：每所在用学校分配到最近医院，逐院汇总学校数和学生数，零学校医院也出现。 具体约束以附带公开原题为准。\n\n## 上游题干\n\nCreate table hospital_catchments containing hospital_id, name, school_count, total_enrollment: assign every ACTIVE school to its nearest hospital, then for each hospital report how many schools were assigned to it and their total enrollment. Every hospital must appear, even ones with zero schools assigned.\n\n## 输入文件\n\n- data/public/GeoAgentEval/worlds/my_world_v0/docs/data_dictionary.md\n\n## 代码与成果提交\n\n- 每次运行使用独立数据库。使用 BENCH_DB_DSN 或适配器提供的 SQL 工具。提交执行过的 SQL 和对象读回，保留列名、类型、SRID 与结果表名。\n- 在 outputs/result.json 填写 status、summary、metrics、artifacts、evidence 和 limitations。如需澄清，补充 reason_code。\n- 使用代码时保留本次执行的脚本或 SQL 及复跑命令。使用工具时记录工具版本、参数、回执和读回。中间结果应能通过输入文件名及参数追溯。\n- 在数据库 public schema 提交表 hospital_catchments，至少含列 hospital_id, name, school_count, total_enrollment。\n- 同步提交执行结果、读回表名及证据。输出缺失条件时填写 reason_code，可用 ambiguous_request、contradictory_constraints、missing_layer 或本题实际原因。\n", "sources": [{"name": "GeoAgentEval", "locator": "tasks/pipe_014.json", "url": "https://github.com/hsd2514/geoagenteval/tree/3da32ce6eb13dac8e0ac263e1e9830da67b8a56b", "revision": "3da32ce6eb13dac8e0ac263e1e9830da67b8a56b"}], "criteria": [{"id": "C1", "points": 25, "requirement": "表/字段/状态条件与原题完全一致"}, {"id": "C2", "points": 40, "requirement": "对象行集、聚合数值或澄清行为满足原 verifier"}, {"id": "C3", "points": 25, "requirement": "读回结果，禁止一对多连接重复计算或读取隐藏答案"}, {"id": "E", "points": 10, "requirement": "成果与输入/参数/真实执行回执一一对应；文件或表确实存在且读回验证；只给计划不得获得操作完成分。"}]}, {"id": "G200-03-S05", "title": "同名学校的实体澄清", "goal": "回答 Town school 当前 enrollment；根据实际名称和实体表判断该指代是否唯一，必要时提出最小澄清。 具体约束以附带公开原题为准。", "domain": "03", "difficulty": "single", "origin": "public_original", "progression": 2, "profiles": ["postgis"], "noncommercial": false, "replacement": false, "grading": "PostGIS 终态检查与证据复核", "stages": [], "prompt": "# G200-03-S05 · 同名学校的实体澄清\n\n输入读取自 inputs/。所有新建本地文件写入 outputs/。\n只使用本题提供的数据和工具。先核对 CRS、字段、版本、单位和运行条件。\n提交实际成果与读回证据。需要澄清业务条件时说明具体问题，环境缺失时列出未完成的工作。\n\n回答 Town school 当前 enrollment；根据实际名称和实体表判断该指代是否唯一，必要时提出最小澄清。 具体约束以附带公开原题为准。\n\n## 上游题干\n\nReport the current enrollment of the Town school.\n\n## 输入文件\n\n- data/public/GeoAgentEval/worlds/my_world_v0/docs/data_dictionary.md\n\n## 代码与成果提交\n\n- 每次运行使用独立数据库。使用 BENCH_DB_DSN 或适配器提供的 SQL 工具。提交执行过的 SQL 和对象读回，保留列名、类型、SRID 与结果表名。\n- 在 outputs/result.json 填写 status、summary、metrics、artifacts、evidence 和 limitations。如需澄清，补充 reason_code。\n- 使用代码时保留本次执行的脚本或 SQL 及复跑命令。使用工具时记录工具版本、参数、回执和读回。中间结果应能通过输入文件名及参数追溯。\n- 同步提交执行结果、读回表名及证据。输出缺失条件时填写 reason_code，可用 ambiguous_request、contradictory_constraints、missing_layer 或本题实际原因。\n", "sources": [{"name": "GeoAgentEval", "locator": "tasks/amb_016.json", "url": "https://github.com/hsd2514/geoagenteval/tree/3da32ce6eb13dac8e0ac263e1e9830da67b8a56b", "revision": "3da32ce6eb13dac8e0ac263e1e9830da67b8a56b"}], "criteria": [{"id": "C1", "points": 25, "requirement": "表/字段/状态条件与原题完全一致"}, {"id": "C2", "points": 40, "requirement": "对象行集、聚合数值或澄清行为满足原 verifier"}, {"id": "C3", "points": 25, "requirement": "读回结果，禁止一对多连接重复计算或读取隐藏答案"}, {"id": "E", "points": 10, "requirement": "成果与输入/参数/真实执行回执一一对应；文件或表确实存在且读回验证；只给计划不得获得操作完成分。"}]}, {"id": "G200-03-S06", "title": "缺少洪区图层时的处理", "goal": "建立 schools_in_flood_zones，选择位于 flood_zones 图层任一面内的学校；先确认所需图层是否存在。 具体约束以附带公开原题为准。", "domain": "03", "difficulty": "single", "origin": "public_original", "progression": 2, "profiles": ["postgis"], "noncommercial": false, "replacement": false, "grading": "PostGIS 终态检查与证据复核", "stages": [], "prompt": "# G200-03-S06 · 缺少洪区图层时的处理\n\n输入读取自 inputs/。所有新建本地文件写入 outputs/。\n只使用本题提供的数据和工具。先核对 CRS、字段、版本、单位和运行条件。\n提交实际成果与读回证据。需要澄清业务条件时说明具体问题，环境缺失时列出未完成的工作。\n\n建立 schoo 09ea5dca3e70fdfe081d39c9ccd0f832fb"}], "criteria": [{"id": "C1", "points": 25, "requirement": "确认目录无所需产量指标"}, {"id": "C2", "points": 40, "requirement": "不能用用电量代替产量"}, {"id": "C3", "points": 25, "requirement": "说明缺失的指标、年份或数据，返回明确不可完成状态"}, {"id": "E", "points": 10, "requirement": "成果与输入/参数/真实执行回执一一对应；文件或表确实存在且读回验证；只给计划不得获得操作完成分。"}]}, {"id": "G200-03-C01", "title": "一对多关系下的双成果统计", "goal": "按原题生成行政区学校统计表和在用学校主地址表；完成关系检查、聚合、地址选择和双表核验。", "domain": "03", "difficulty": "composite", "origin": "adapted", "progression": 3, "profiles": ["postgis"], "noncommercial": false, "replacement": false, "grading": "PostGIS 终态检查与证据复核", "stages": ["检查表主外键", "计算逐区学校统计", "选择主地址形成第二张表", "回查总量与重复"], "prompt": "# G200-03-C01 · 一对多关系下的双成果统计\n\n输入读取自 inputs/。所有新建本地文件写入 outputs/。\n只使用本题提供的数据和工具。先核对 CRS、字段、版本、单位和运行条件。\n提交实际成果与读回证据。需要澄清业务条件时说明具体问题，环境缺失时列出未完成的工作。\n\n按原题生成行政区学校统计表和在用学校主地址表；完成关系检查、聚合、地址选择和双表核验。\n\n## 上游题干\n\nCreate two tables. ward_enrollment_v2: ward_id, total_enrollment, total_schools for each ward, using only active schools located inside that ward's polygon. school_contacts: school_id, name, primary_address for every active school, using each school's primary address from school_addresses (is_primary = true).\n\n## 有依赖的阶段\n\n1. 检查表主外键\n2. 计算逐区学校统计\n3. 选择主地址形成第二张表\n4. 回查总量与重复\n\n## 输入文件\n\n- data/public/GeoAgentEval/worlds/my_world_v0/docs/data_dictionary.md\n\n## 代码与成果提交\n\n- 每次运行使用独立数据库。使用 BENCH_DB_DSN 或适配器提供的 SQL 工具。提交执行过的 SQL 和对象读回，保留列名、类型、SRID 与结果表名。\n- 在 outputs/result.json 填写 status、summary、metrics、artifacts、evidence 和 limitations。如需澄清，补充 reason_code。\n- 使用代码时保留本次执行的脚本或 SQL 及复跑命令。使用工具时记录工具版本、参数、回执和读回。中间结果应能通过输入文件名及参数追溯。\n- 在数据库 public schema 提交表 ward_enrollment_v2，至少含列 ward_id, total_enrollment, total_schools。\n- 同步提交执行结果、读回表名及证据。输出缺失条件时填写 reason_code，可用 ambiguous_request、contradictory_constraints、missing_layer 或本题实际原因。\n", "sources": [{"name": "GeoAgentEval", "locator": "tasks/agg_020.json", "url": "https://github.com/hsd2514/geoagenteval/tree/3da32ce6eb13dac8e0ac263e1e9830da67b8a56b", "revision": "3da32ce6eb13dac8e0ac263e1e9830da67b8a56b"}], "criteria": [{"id": "C1", "points": 25, "requirement": "人数聚合不因地址多行被放大"}, {"id": "C2", "points": 40, "requirement": "主地址选择和零学校区满足 verifier"}, {"id": "C3", "points": 25, "requirement": "两表可读回且跨表一致"}, {"id": "E", "points": 10, "requirement": "成果与输入/参数/真实执行回执一一对应；文件或表确实存在且读回验证；只给计划不得获得操作完成分。"}]}, {"id": "G200-03-C02", "title": "多条件学校优先清单", "goal": "按公开原题完成河流距离、行政区平均高程、在用状态和人数前五名筛选，并附每个学校的入选证据表。", "domain": "03", "difficulty": "composite", "origin": "adapted", "progression": 3, "profiles": ["postgis"], "noncommercial": false, "replacement": false, "grading": "PostGIS 终态检查与证据复核", "stages": ["识别源表及河流", "计算空间与高程资格", "排序生成清单", "输出逐对象依据并回查"], "prompt": "# G200-03-C02 · 多条件学校优先清单\n\n输入读取自 inputs/。所有新建本地文件写入 outputs/。\n只使用本题提供的数据和工具。先核对 CRS、字段、版本、单位和运行条件。\n提交实际成果与读回证据。需要澄清业务条件时说明具体问题，环境缺失时列出未完成的工作。\n\n按公开原题完成河流距离、行政区平均高程、在用状态和人数前五名筛选，并附每个学校的入选证据表。\n\n## 上游题干\n\nCreate table flood_risk_ranked containing the active schools with highest enrollment among those that are BOTH within 800 metres of any river AND located in a ward with avg_elevation_m \u003c 550. Columns: school_id, name, enrollment, rank (1 = highest enrollment). Include at most 5 rows; if fewer than 5 schools qualify, include all of them.\n\n## 有依赖的阶段\n\n1. 识别源表及河流\n2. 计算空间与高程资格\n3. 排序生成清单\n4. 输出逐对象依据并回查\n\n## 输入文件\n\n- data/public/GeoAgentEval/worlds/my_world_v0/docs/data_dictionary.md\n\n## 代码与成果提交\n\n- 每次运行使用独立数据库。使用 BENCH_DB_DSN 或适配器提供的 SQL 工具。提交执行过的 SQL 和对象读回，保留列名、类型、SRID 与结果表名。\n- 在 outputs/result.json 填写 status、summary、metrics、artifacts、evidence 和 limitations。如需澄清，补充 reason_code。\n- 使用代码时保留本次执行的脚本或 SQL 及复跑命令。使用工具时记录工具版本、参数、回执和读回。中间结果应能通过输入文件名及参数追溯。\n- 在数据库 public schema 提交表 flood_risk_ranked，至少含列 school_id, name, enrollment, rank。\n- 同步提交执行结果、读回表名及证据。输出缺失条件时填写 reason_code，可用 ambiguous_request、contradictory_constraints、missing_layer 或本题实际原因。\n", "sources": [{"name": "GeoAgentEval", "locator": "tasks/pipe_012.json", "url": "https://github.com/hsd2514/geoagenteval/tree/3da32ce6eb13dac8e0ac263e1e9830da67b8a56b", "revision": "3da32ce6eb13dac8e0ac263e1e9830da67b8a56b"}], "criteria": [{"id": "C1", "points": 25, "requirement": "800 m、550 m 和状态条件按原题"}, {"id": "C2", "points": 40, "requirement": "排序/并列及前五集合符合 verifier"}, {"id": "C3", "points": 25, "requirement": "每一入选记录有三个条件及人数证据"}, {"id": "E", "points": 10, "requirement": "成果与输入/参数/真实执行回执一一对应；文件或表确实存在且读回验证；只给计划不得获得操作完成分。"}]}, {"id": "G200-04-S01", "title": "河流缓冲与闭边界", "goal": "建立 flood_risk_schools，包含距 Main River 500 m 内的在用学校，字段 school_id、name、geom。 具体约束以附带公开原题为准。", "domain": "04", "difficulty": "single", "origin": "public_original", "progression": 2, "profiles": ["postgis"], "noncommercial": false, "replacement": false, "grading": "PostGIS 终态检查与证据复核", "stages": [], "prompt": "# G200-04-S01 · 河流缓冲与闭边界\n\n输入读取自 inputs/。所有新建本地文件写入 outputs/。\n只使用本题提供的数据和工具。先核对 CRS、字段、版本、单位和运行条件。\n提交实际成果与读回证据。需要澄清业务条件时说明具体问题，环境缺失时列出未完成的工作。\n\n建立 flood_risk_schools，包含距 Main River 500 m 内的在用学校，字段 school_id、name、geom。 具体约束以附带公开原题为准。\n\n## 上游题干\n\nCreate table flood_risk_schools containing active schools within 500 metres of the Main River. Include columns school_id, name, geom.\n\n## 输入文件\n\n- data/public/GeoAgentEval/worlds/my_world_v0/docs/data_dictionary.md\n\n## 代码与成果提交\n\n- 每次运行使用独立数据库。使用 BENCH_DB_DSN 或适配器提供的 SQL 工具。提交执行过的 SQL 和对象读回，保留列名、类型、SRID 与结果表名。\n- 在 outputs/result.json 填写 status、summary、metrics、artifacts、evidence 和 limitations。如需澄清，补充 reason_code。\n- 使用代码时保留本次执行的脚本或 SQL 及复跑命令。使用工具时记录工具版本、参数、回执和读回。中间结果应能通过输入文件名及参数追溯。\n- 在数据库 public schema 提交表 flood_risk_schools，至少含列 school_id, name, geom。\n- 输出几何类型 Point，EPSG:32643。\n- 同步提交执行结果、读回表名及证据。输出缺失条件时填写 reason_code，可用 ambiguous_request、contradictory_constraints、missing_layer 或本题实际原因。\n", "sources": [{"name": "GeoAgentEval", "locator": "tasks/flood_001.json", "url": "https://github.com/hsd2514/geoagenteval/tree/3da32ce6eb13dac8e0ac263e1e9830da67b8a56b", "revision": "3da32ce6eb13dac8e0ac263e1e9830da67b8a56b"}], "criteria": [{"id": "C1", "points": 25, "requirement": "实体选择/距离边界符合原题"}, {"id": "C2", "points": 40, "requirement": "结果或澄清满足上游 verifier"}, {"id": "C3", "points": 25, "requirement": "空间单位正确且无不必要拒绝"}, {"id": "E", "points": 10, "requirement": "成果与输入/参数/真实执行回执一一对应；文件或表确实存在且读回验证；只给计划不得获得操作完成分。"}]}, {"id": "G200-04-S02", "title": "远离所有医院的学校", "goal": "建立 remote_schools：选择距每一家医院都超过 2 km 的在用学校，字段 school_id、name。 具体约束以附带公开原题为准。", "domain": "04", "difficulty": "single", "origin": "public_original", "progression": 2, "profiles": ["postgis"], "noncommercial": false, "replacement": false, "grading": "PostGIS 终态检查与证据复核", "stages": [], "prompt": "# G200-04-S02 · 远离所有医院的学校\n\n输入读取自 inputs/。所有新建本地文件写入 outputs/。\n只使用本题提供的数据和工具。先核对 CRS、字段、版本、单位和运行条件。\n提交实际成果与读回证据。需要澄清业务条件时说明具体问题，环境缺失时列出未完成的工作。\n\n建立 remote_schools：选择距每一家医院都超过 2 km 的在用学校，字段 school_id、name。 具体约束以附带公开原题为准。\n\n## 上游题干\n\nCreate table remote_schools containing school_id, name for every active school that is farther than 2 kilometres from every hospital (i.e. not within 2km of any hospital).\n\n## 输入文件\n\n- data/public/GeoAgentEval/worlds/my_world_v0/docs/data_dictionary.md\n\n## 代码与成果提交\n\n- 每次运行使用独立数据库。使用 BENCH_DB_DSN 或适配器提供的 SQL 工具。提交执行过的 SQL 和对象读回，保留列名、类型、SRID 与结果表名。\n- 在 outputs/result.json 填写 status、summary、metrics、artifacts、evidence 和 limitations。如需澄清，补充 reason_code。\n- 使用代码时保留本次执行的脚本或 SQL 及复跑命令。使用工具时记录工具版本、参数、回执和读回。中间结果应能通过输入文件名及参数追溯。\n- 在数据库 public schema 提交表 remote_schools，至少含列 school_id, name。\n- 同步提交执行结果、读回表名及证据。输出缺失条件时填写 reason_code，可用 ambiguous_request、contradictory_constraints、missing_layer 或本题实际原因。\n", "sources": [{"name": "GeoAgentEval", "locator": "tasks/route_006.json", "url": "https://github.com/hsd2514/geoagenteval/tree/3da32ce6eb13dac8e0ac263e1e9830da67b8a56b", "revision": "3da32ce6eb13dac8e0ac263e1e9830da67b8a56b"}], "criteria": [{"id": "C1", "points": 25, "requirement": "实体选择/距离边界符合原题"}, {"id": "C2", "points": 40, "requirement": "结果或澄清满足上游 verifier"}, {"id": "C3", "points": 25, "requirement": "空间单位正确且无不必要拒绝"}, {"id": "E", " 取自 inputs/。所有新建本地文件写入 outputs/。\n只使用本题提供的数据和工具。先核对 CRS、字段、版本、单位和运行条件。\n提交实际成果与读回证据。需要澄清业务条件时说明具体问题，环境缺失时列出未完成的工作。\n\n对三个权重情景生成排名，计算稳定入选/不稳定入选区域，叠加矿点并输出分情景面积和证据表；只提交验证优先级，不生成钻孔位置。\n\n## 有依赖的阶段\n\n1. 计算三套分数\n2. 按面积预算选择\n3. 求交并集与名次变化\n4. 地图与逐区证据交付\n\n## 输入文件\n\n- data/contracts/mpm_protocol.json\n- data/derived/mpm/fold_grid.csv\n- data/derived/mpm/occurrences.csv\n\n## 代码与成果提交\n\n- 使用输入的 CRS、几何、掩膜和单位。可使用 GeoPandas、Pyogrio、Rasterio、PyProj、NumPy 或等价工具。核验实际输出数据及元数据。\n- 在 outputs/result.json 填写 status、summary、metrics、artifacts、evidence 和 limitations。如需澄清，补充 reason_code。\n- 使用代码时保留本次执行的脚本或 SQL 及复跑命令。使用工具时记录工具版本、参数、回执和读回。中间结果应能通过输入文件名及参数追溯。\n", "sources": [{"name": "GABench", "locator": "CSV ID=20", "url": "https://github.com/GeoX-Lab/GABench/tree/357d0f531d55bfbd701a79a77af86c1db3b22325", "revision": "357d0f531d55bfbd701a79a77af86c1db3b22325"}], "criteria": [{"id": "C1", "points": 25, "requirement": "三个情景参数与数据域相同且可回放"}, {"id": "C2", "points": 40, "requirement": "稳定区定义为三情景 Top10% 交集，边缘区为并集减交集"}, {"id": "C3", "points": 25, "requirement": "矿点落入率与空间独立验证分开，不能在同一数据上宣称泛化成功"}, {"id": "E", "points": 10, "requirement": "成果与输入/参数/真实执行回执一一对应；文件或表确实存在且读回验证；只给计划不得获得操作完成分。"}]}, {"id": "G200-06-S01", "title": "MODIS NDSI 浮点计算", "goal": "将两波段转为 float64，在双波段共同有效且分母非零的像元计算 NDSI=(b04-b06)/(b04+b06)，求均值并保留三位小数，同时提交指数栅格及有效数。 将指数栅格命名为 ndsi.tif，输出沿用输入网格与 CRS。", "domain": "06", "difficulty": "single", "origin": "adapted", "progression": 1, "profiles": ["gis"], "noncommercial": true, "replacement": false, "grading": "冻结参考值与证据复核", "stages": [], "prompt": "# G200-06-S01 · MODIS NDSI 浮点计算\n\n输入读取自 inputs/。所有新建本地文件写入 outputs/。\n只使用本题提供的数据和工具。先核对 CRS、字段、版本、单位和运行条件。\n提交实际成果与读回证据。需要澄清业务条件时说明具体问题，环境缺失时列出未完成的工作。\n\n将两波段转为 float64，在双波段共同有效且分母非零的像元计算 NDSI=(b04-b06)/(b04+b06)，求均值并保留三位小数，同时提交指数栅格及有效数。 将指数栅格命名为 ndsi.tif，输出沿用输入网格与 CRS。\n\n## 输入文件\n\n- data/public/Earth-Bench-V2/data/question129/Tibetan Plateau_sur_refl_b04_2021-07-01.tif\n- data/public/Earth-Bench-V2/data/question129/Tibetan Plateau_sur_refl_b06_ 单。\n- 在 outputs/result.json 填写 status、summary、metrics、artifacts、evidence 和 limitations。如需澄清，补充 reason_code。\n- 使用代码时保留本次执行的脚本或 SQL 及复跑命令。使用工具时记录工具版本、参数、回执和读回。中间结果应能通过输入文件名及参数追溯。\n", "sources": [{"name": "GABench", "locator": "CSV ID=20", "url": "https://github.com/GeoX-Lab/GABench/tree/357d0f531d55bfbd701a79a77af86c1db3b22325", "revision": "357d0f531d55bfbd701a79a77af86c1db3b22325"}, {"name": "GABench", "locator": "CSV ID=53", "url": "https://github.com/GeoX-Lab/GABench/tree/357d0f531d55bfbd701a79a77af86c1db3b22325", "revision": "357d0f531d55bfbd701a79a77af86c1db3b22325"}], "criteria": [{"id": "C1", "points": 25, "requirement": "指标能从 OOF 表复算且缺陷定位具体句子"}, {"id": "C2", "points": 40, "requirement": "有利度/PU 指标不写成无矿证实或发现概率"}, {"id": "C3", "points": 25, "requirement": "修正版区分计算、解释、假设及未知"}, {"id": "E", "points": 10, "requirement": "成果与输入/参数/真实执行回执一一对应；文件或表确实存在且读回验证；只给计划不得获得操作完成分。"}]}]</script>
<script>
const $ = id => document.getElementById(id);
const tasks = JSON.parse($("data").textContent);
const labels = {public_original:"公开原题",adapted:"改编题",new:"新增题",single:"单任务",composite:"复合任务"};
const esc = s => String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
const size = 20;
let page=0;
function item(t) {
  const facts = [labels[t.difficulty], labels[t.origin], "梯度 "+t.progression, t.profiles.join(", "), t.grading];
  if(t.replacement) facts.push("合成输入");
  if(t.noncommercial) facts.push("CC BY-NC 数据");
  const sources = t.sources.map(s => '<li><a href="' + esc(s.url) + '">' + esc(s.name) + '</a> · ' + esc(s.locator) + ' · <code>' + esc(s.revision) + '</code></li>').join("");
  const criteria = t.criteria.map(c => "<li>"+c.points+" 分 · "+esc(c.requirement)+"</li>").join("");
  return "<details class='card'><summary>"+esc(t.id)+" · "+esc(t.title)+"</summary><div class='content'>"+
    "<p class='meta'>"+esc(facts.join(" · "))+"</p><p>"+esc(t.goal)+"</p>"+
    "<details><summary>提示词、输入和代码交付</summary><pre>"+esc(t.prompt)+"</pre></details>"+
    "<details><summary>评分标准</summary><ul>"+criteria+"</ul></details>"+
    "<details><summary>来源与版本</summary><ul>"+sources+"</ul></details></div></details>";
}
function render() {
  const query = $("query").value.toLowerCase().trim();
  const result = tasks.filter(t =>
    (!query || (t.id+" "+t.title+" "+t.goal).toLowerCase().includes(query)) &&
    ["domain","difficulty","origin"].every(k => !$(k).value || t[k] === $(k).value));
  const pages=Math.max(1,Math.ceil(result.length/size));
  page=Math.min(page,pages-1);
  $("count").textContent=result.length+" / "+tasks.length+" 道题";
  $("tasks").innerHTML=result.slice(page*size,(page+1)*size).map(item).join("") || "<p>没有匹配的题目。</p>";
  $("page").textContent=(page+1)+" / "+pages;
  $("prev").disabled=page===0;
  $("next").disabled=page+1===pages;
}
for(const id of ["query","domain","difficulty","origin"]) $(id).addEventListener("input",()=>{page=0;render();});
$("prev").onclick=()=>{page--;render();};
$("next").onclick=()=>{page++;render();};
render();
</script>
